<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8fae96">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="校招助手">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>校招咨询助手</title>
  <script>
    // 自愈：缓存的旧 index.html 引用已被新构建删除的 JS 时（404），
    // 自动带时间戳参数强制刷新一次，绕过旧缓存拿到新 index.html
    window.addEventListener('error', function (e) {
      var t = e.target
      if (t && t.tagName === 'SCRIPT' && !/[?&]r=/.test(location.search)) {
        location.replace(location.pathname + '?r=' + Date.now() + location.hash)
      }
    }, true)
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
